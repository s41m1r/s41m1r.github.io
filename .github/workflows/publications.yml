# Regenerates the publication lists in index.html from the .bib files
name: Update publication list

on:
  push:
    branches: ["main"]
    paths:
      - "mypapers.bib"
      - "publications-site.bib"
      - "scripts/build_publications.py"
      - ".github/workflows/publications.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the .bib files into index.html
        run: python3 scripts/build_publications.py

      - name: Commit regenerated publication list
        id: commit
        run: |
          if git diff --quiet -- index.html scholar.json; then
            echo "publication list already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scholar.json
          git commit -m "chore: rebuild publication list from publications.bib"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows,
  # so the Pages deployment has to be called explicitly.
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
